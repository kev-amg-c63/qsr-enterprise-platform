name: Fabric DEV Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Validate or publish Fabric artifacts"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - publish

permissions:
  contents: read
  id-token: write

concurrency:
  group: fabric-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Fabric DEV Deployment
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install fabric-cicd azure-identity

      - name: Validate Fabric definitions
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
        run: |
          python scripts/deploy_fabric.py --mode validate

      - name: Azure login using OIDC
        if: ${{ inputs.deployment_mode == 'publish' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish Fabric artifacts
        if: ${{ inputs.deployment_mode == 'publish' }}
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
        run: |
          python scripts/deploy_fabric.py --mode publish