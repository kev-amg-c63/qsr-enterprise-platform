
name: Fabric OIDC Validation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-oidc:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify Azure identity
        run: |
          az account show --output table

      - name: Verify Fabric workspace configuration
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
        run: |
          test -n "$FABRIC_WORKSPACE_ID"
          echo "Fabric workspace ID is configured."
      - name: Validate Fabric REST API access
        shell: bash
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail

          TOKEN=$(az account get-access-token \
            --resource https://api.fabric.microsoft.com \
            --query accessToken -o tsv)

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $TOKEN" \
            "https://api.fabric.microsoft.com/v1/workspaces/$FABRIC_WORKSPACE_ID"
